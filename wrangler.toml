name = "spotify-agent"
main = "src/index.ts"
compatibility_date = "2025-04-28"
compatibility_flags = ["nodejs_compat"]

# ── D1 database ──
[[d1_databases]]
binding = "DB"
database_name = "spotify-agent-db"
database_id = "a639e396-3fb1-4db6-b5a5-ce61c60d5779"
migrations_dir = "src/db/migrations"

# ── KV namespace ──
[[kv_namespaces]]
binding = "KV"
id = "7055b925a6b74bd39150201370724eeb"

# OAuth 2.1 token storage (used by @cloudflare/workers-oauth-provider)
# Create with: wrangler kv:namespace create OAUTH_KV
# ⚠ Deploy will fail until the id below is replaced with the real namespace ID.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "8074b84461bd42d498eeba4cad171d39"

# ── Cron triggers ──
[triggers]
crons = [
  "* * * * *",       # every minute: poll currently-playing + derive with context linking
  "*/2 * * * *",     # every 2 minutes: in-session feedback + hourly context snapshot
  "0 5 * * *",       # daily 5am UTC (1am ET): derive, taste rebuild, audio backfill, prune,
                     #                          fresh_pool insert for new submissions
  "0 10 * * *",      # daily 10am UTC (6am ET): discovery agent, constellation rebuild
  "0 0 * * *",       # midnight UTC (8pm ET): nightly listening summary email
]

name = "spotify-agent"
main = "src/index.ts"
compatibility_date = "2025-04-28"

# ── D1 database ──
[[d1_databases]]
binding = "DB"
database_name = "spotify-agent-db"
database_id = "a639e396-3fb1-4db6-b5a5-ce61c60d5779"

# ── KV namespace ──
[[kv_namespaces]]
binding = "KV"
id = "7055b925a6b74bd39150201370724eeb"

# ── Cron triggers ──
[triggers]
crons = [
  "* * * * *",       # every minute: poll currently-playing
  "0 5 * * *",       # daily 5am UTC (1am ET): derive play_events + prune + taste rebuild
  "0 10 * * *",      # daily 10am UTC (6am ET): discovery agent
]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blind Rating — Lyric Experiment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      max-width: 500px; margin: 0 auto; padding: 2rem 1rem;
      background: #1a1a2e; color: #e0e0e0;
      min-height: 100vh;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; color: #fff; }
    .progress { font-size: 0.85rem; color: #888; margin-bottom: 2rem; }
    .progress span { color: #1db954; font-weight: 600; }
    #status { margin: 1.5rem 0; padding: 1rem; border-radius: 8px; background: #16213e; text-align: center; min-height: 80px; display: flex; align-items: center; justify-content: center; }
    #status.playing { border: 2px solid #1db954; }
    #status.waiting { border: 2px solid #444; }
    .rating-row { display: flex; gap: 0.75rem; justify-content: center; margin: 1.5rem 0; }
    .rating-btn {
      width: 56px; height: 56px; border-radius: 50%; border: 2px solid #444;
      background: #16213e; color: #e0e0e0; font-size: 1.4rem; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
    }
    .rating-btn:hover { border-color: #1db954; background: #1db95422; transform: scale(1.1); }
    .rating-btn:active { transform: scale(0.95); }
    .skip-btn {
      display: block; margin: 1rem auto; padding: 0.6rem 1.5rem;
      background: none; border: 1px solid #555; border-radius: 20px;
      color: #888; font-size: 0.85rem; cursor: pointer;
    }
    .skip-btn:hover { border-color: #aaa; color: #aaa; }
    .controls { margin-top: 2rem; display: flex; gap: 1rem; justify-content: center; }
    .controls button {
      padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid #444;
      background: #16213e; color: #e0e0e0; font-size: 0.85rem; cursor: pointer;
    }
    .controls button:hover { border-color: #1db954; }
    .done { text-align: center; padding: 2rem; }
    .done h2 { color: #1db954; margin-bottom: 1rem; }
    #export-btn {
      padding: 0.7rem 1.5rem; border-radius: 6px; border: none;
      background: #1db954; color: #000; font-weight: 600; font-size: 1rem;
      cursor: pointer; margin-top: 1rem;
    }
    .history { margin-top: 2rem; font-size: 0.75rem; color: #666; }
    .history summary { cursor: pointer; color: #888; }
  </style>
</head>
<body>
  <h1>Blind Rating</h1>
  <div class="progress">
    Song <span id="current-pos">-</span> of <span id="total">200</span>
    &nbsp;|&nbsp; Rated: <span id="rated-count">0</span>
    &nbsp;|&nbsp; Skipped: <span id="skipped-count">0</span>
  </div>

  <div id="status" class="waiting">
    <span id="status-text">Loading...</span>
  </div>

  <div id="rating-area" style="display:none;">
    <div class="rating-row">
      <button class="rating-btn" data-rating="1">1</button>
      <button class="rating-btn" data-rating="2">2</button>
      <button class="rating-btn" data-rating="3">3</button>
      <button class="rating-btn" data-rating="4">4</button>
      <button class="rating-btn" data-rating="5">5</button>
    </div>
    <button class="skip-btn" id="skip-btn">skip — can't form an opinion</button>
  </div>

  <div class="controls">
    <button id="play-btn">Play Current</button>
    <button id="next-btn" style="display:none;">Next (unrated)</button>
    <button id="export-btn-small">Export CSV</button>
  </div>

  <div id="done-screen" style="display:none;" class="done">
    <h2>All done!</h2>
    <p>You've rated all 200 songs.</p>
    <button id="export-btn">Download rankings.csv</button>
  </div>

  <details class="history">
    <summary>Session history</summary>
    <pre id="history-log"></pre>
  </details>

  <script>
    // ─── Seeded RNG (mulberry32) ────────────────────────────────────────────
    const RNG_SEED = 20260503;
    function mulberry32(seed) {
      let t = seed;
      return () => {
        t = (t + 0x6D2B79F5) | 0;
        let x = Math.imul(t ^ (t >>> 15), 1 | t);
        x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
    }
    function shuffle(arr, rng) {
      const result = [...arr];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    // ─── State ──────────────────────────────────────────────────────────────
    const STORAGE_KEY = 'lyric-experiment-ratings-v1';
    let candidates = [];
    let order = []; // shuffled indices
    let currentIdx = 0; // position in order[]
    let ratings = {}; // uri → { rating: 1-5 | null, skipped: bool }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        ratings = parsed.ratings || {};
        currentIdx = parsed.currentIdx || 0;
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ratings, currentIdx }));
    }

    // ─── Spotify playback via Surfaces API ──────────────────────────────────
    const SURFACES_BASE = 'https://surfaces.chrisbuice.com';

    async function playTrack(uri) {
      try {
        const trackId = uri.replace('spotify:track:', '');
        const res = await fetch(`${SURFACES_BASE}/api/play-track?uri=${encodeURIComponent(uri)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });
        if (!res.ok) {
          // Fallback: try queue endpoint
          const qRes = await fetch(`${SURFACES_BASE}/api/queue-track?uri=${encodeURIComponent(uri)}`, {
            method: 'POST',
          });
          if (!qRes.ok) throw new Error(`Queue failed: ${qRes.status}`);
          setStatus('Queued — press play on Spotify', 'waiting');
          return;
        }
        setStatus('Playing...', 'playing');
      } catch (e) {
        // If API fails, show Spotify link as fallback
        setStatus(`API unavailable. Open: spotify:track:${uri.replace('spotify:track:','')}`, 'waiting');
      }
    }

    // ─── UI ─────────────────────────────────────────────────────────────────
    function setStatus(text, cls) {
      const el = document.getElementById('status');
      document.getElementById('status-text').textContent = text;
      el.className = cls;
    }

    function updateProgress() {
      const rated = Object.values(ratings).filter(r => r.rating !== null && r.rating !== undefined).length;
      const skipped = Object.values(ratings).filter(r => r.skipped).length;
      document.getElementById('current-pos').textContent = currentIdx + 1;
      document.getElementById('rated-count').textContent = rated;
      document.getElementById('skipped-count').textContent = skipped;
    }

    function findNextUnrated() {
      // Find next position in order that hasn't been rated or skipped
      for (let i = currentIdx; i < order.length; i++) {
        const uri = candidates[order[i]].spotify_track_uri;
        if (!ratings[uri]) return i;
      }
      // Wrap around from beginning
      for (let i = 0; i < currentIdx; i++) {
        const uri = candidates[order[i]].spotify_track_uri;
        if (!ratings[uri]) return i;
      }
      return -1; // all done
    }

    function showCurrent() {
      const nextIdx = findNextUnrated();
      if (nextIdx === -1) {
        // All done
        document.getElementById('rating-area').style.display = 'none';
        document.getElementById('done-screen').style.display = 'block';
        setStatus('Complete!', 'waiting');
        updateProgress();
        return;
      }
      currentIdx = nextIdx;
      updateProgress();
      setStatus(`Ready — press Play to listen (song ${currentIdx + 1})`, 'waiting');
      document.getElementById('rating-area').style.display = 'block';
      document.getElementById('done-screen').style.display = 'none';
      saveState();
    }

    function recordRating(rating) {
      const uri = candidates[order[currentIdx]].spotify_track_uri;
      ratings[uri] = { rating, skipped: false, timestamp: Date.now() };
      saveState();
      logHistory(`#${currentIdx + 1}: rated ${rating}`);
      currentIdx++;
      showCurrent();
    }

    function recordSkip() {
      const uri = candidates[order[currentIdx]].spotify_track_uri;
      ratings[uri] = { rating: null, skipped: true, timestamp: Date.now() };
      saveState();
      logHistory(`#${currentIdx + 1}: skipped`);
      currentIdx++;
      showCurrent();
    }

    function logHistory(msg) {
      const el = document.getElementById('history-log');
      el.textContent = msg + '\n' + el.textContent;
    }

    // ─── Export ─────────────────────────────────────────────────────────────
    function exportCSV() {
      const lines = ['spotify_track_uri,blind_rating,skipped,rated_at'];
      for (const [uri, data] of Object.entries(ratings)) {
        lines.push(`${uri},${data.rating || ''},${data.skipped || false},${data.timestamp || ''}`);
      }
      const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'blind-ratings.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    // ─── Init ───────────────────────────────────────────────────────────────
    async function init() {
      try {
        const res = await fetch('../../docs/experiments/lyric-analysis-2026-05/candidates.json');
        if (!res.ok) {
          // Try relative paths for different serve locations
          const res2 = await fetch('./candidates.json');
          if (!res2.ok) throw new Error('Cannot load candidates.json');
          const data = await res2.json();
          candidates = data.candidates;
        } else {
          const data = await res.json();
          candidates = data.candidates;
        }
      } catch (e) {
        // Try loading from same directory
        try {
          const res = await fetch('candidates.json');
          const data = await res.json();
          candidates = data.candidates;
        } catch (e2) {
          setStatus('Error: cannot load candidates.json. Serve from experiment dir.', 'waiting');
          return;
        }
      }

      document.getElementById('total').textContent = candidates.length;

      // Shuffle with seeded RNG
      const rng = mulberry32(RNG_SEED);
      order = shuffle(Array.from({ length: candidates.length }, (_, i) => i), rng);

      // Load saved state
      loadState();
      updateProgress();
      showCurrent();

      // Wire up buttons
      document.querySelectorAll('.rating-btn').forEach(btn => {
        btn.addEventListener('click', () => recordRating(parseInt(btn.dataset.rating)));
      });
      document.getElementById('skip-btn').addEventListener('click', recordSkip);
      document.getElementById('play-btn').addEventListener('click', () => {
        const uri = candidates[order[currentIdx]].spotify_track_uri;
        playTrack(uri);
      });
      document.getElementById('export-btn-small').addEventListener('click', exportCSV);
      const exportBtn = document.getElementById('export-btn');
      if (exportBtn) exportBtn.addEventListener('click', exportCSV);
    }

    init();
  </script>
</body>
</html>
